name: Action proof (temporary)
on:
  push:
    branches: [chore/clean-text-and-actions]
  pull_request:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --version && node --version
      - run: node tools/check-package.mjs --keep "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-proof
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
  fetch:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: tarball-proof
          path: ${{ runner.temp }}/pack
      - run: ls -l "$RUNNER_TEMP/pack" && tar -tzf "$RUNNER_TEMP"/pack/*.tgz | head -5
