# Releases the package when what ships has changed since its last tag, then publishes it. See
# AGENTS.md, "Releasing".
#
# Push to main: the `tag` job looks at what main holds, not at the push: if anything the tarball is
# built from (`SHIPPED` in tools/release.mjs) changed since the last `v*` tag, the version is bumped
# and tagged with the strongest `release:*` label among the PRs that changed it. A cancelled, late
# or failed run loses nothing; the next run picks it up. Every step is decided from state, so
# overlapping runs agree: `publish` skips a version already on npm, and `github-releases` makes a
# Release for any tag on npm that has none.
# A manual dispatch with `tag` (a backfill) runs the same steps for that tag. A tag push starts
# nothing.
# Everything runs in this one file because npm's trusted publisher names the workflow file: on
# npmjs.com the package's trusted publisher is this repository, `release.yml` and the `npm`
# environment. The `npm` environment allows deployments from `main` only, so the workflow file and
# scripts that run with the token are always main's. The token is not a secret; it is minted per
# run.
#
# The job holding `id-token: write` (`publish`) checks out nothing and installs nothing from the
# repo: it publishes the tarball `verify` built and checked, so the repo's dependency code never
# meets the token. The only code it fetches is the pinned npm itself.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to check and publish, such as v0.1.0
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    # Only this job writes to main. Runs wait one at a time, and a waiting run replaced by a newer
    # one loses nothing: each run decides from main's state.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    outputs:
      unpublished: ${{ steps.resolve.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # A failed release (a walk too long) is reported at the end, after any unpublished tag is found.
      - name: Bump, tag and push when what ships changed since the last tag
        id: release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs release

      - name: Check each tag and find those not on npm yet
        id: resolve
        if: steps.release.outputs.tags || inputs.tag
        env:
          TAGS: ${{ steps.release.outputs.tags || inputs.tag }}
        run: node tools/release.mjs resolve "$TAGS"

      - name: Fail the run if the release failed
        if: steps.release.outcome == 'failure'
        run: exit 1

  verify:
    needs: tag
    if: ${{ !cancelled() && needs.tag.outputs.unpublished != '' && needs.tag.outputs.unpublished != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.tag.outputs.unpublished) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.release.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the repo, then pack and check the tarball a consumer would install
        run: |
          pnpm lint && pnpm typecheck && pnpm test
          node tools/check-package.mjs --keep "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.release.tag }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    needs: [tag, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.tag.outputs.unpublished) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          # Runs with the OIDC token present, but installs only the pinned npm itself: nothing from
          # the repo or its dependencies.
          # npm 12.0.0 omits sigstore from its published bundle (npm/cli#9722).
          # Keep provenance publishing on the latest verified npm 11 release.
          npm install -g npm@11.18.0
          test -f "$(npm root -g)/npm/node_modules/sigstore/package.json"

      - uses: actions/download-artifact@v4
        with:
          name: tarball-${{ matrix.release.tag }}
          path: ${{ runner.temp }}/pack

      - name: Publish
        env:
          NAME: ${{ matrix.release.name }}
          VERSION: ${{ matrix.release.version }}
          DIST_TAG: ${{ matrix.release.distTag }}
        run: |
          # A version already on npm is done, not a failure: an overlapping run may have published it.
          on_npm() { npm view "$NAME@$VERSION" version >/dev/null 2>&1; }
          if on_npm; then echo "$NAME@$VERSION is already on npm"; exit 0; fi
          npm publish "$RUNNER_TEMP/pack/$(sed 's/^@//; s#/#-#' <<<"$NAME")-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG" || on_npm

  # A GitHub Release for every tag on npm that has none, including the hand-published first version.
  # A tag that never reached npm (a failed verify) gets none.
  github-releases:
    needs: [tag, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node tools/release.mjs github-releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
