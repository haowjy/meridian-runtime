# Releases each package a merged PR changed, then publishes it. See AGENTS.md, "Releasing".
#
# Push to main: the `tag` job reads the PR's `release:*` label, bumps and tags each changed package
# (tools/release.mjs). A tag pushed by hand (the first version of a package, or a backfill) or a
# manual dispatch with `tag` skips that step and goes straight to the checks.
# Everything runs in this one file because npm's trusted publisher names the workflow file: on
# npmjs.com each package's trusted publisher is this repository, `release.yml` and the `npm`
# environment. The token for that is not a secret; it is minted per run.
#
# The job holding `id-token: write` (`publish`) checks out nothing and installs nothing: it
# publishes the tarball `verify` built and checked, so dependency code never meets the token.
name: Release

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to check, publish and release, such as gateway-v0.1.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases: ${{ steps.resolve.outputs.releases }}
      unpublished: ${{ steps.resolve.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || (github.ref_type == 'branch' && 'main' || github.ref) }}
          fetch-depth: 0

      - name: Bump, tag and push the packages the merged PR changed
        id: release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node tools/release.mjs release

      - name: Check each tag and find those not on npm yet
        id: resolve
        env:
          TAGS: ${{ steps.release.outputs.tags || inputs.tag || github.ref_name }}
        run: node tools/release.mjs resolve "$TAGS"

  verify:
    needs: tag
    if: needs.tag.outputs.unpublished != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.tag.outputs.unpublished) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.release.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the repo, then pack and check the tarball a consumer would install
        run: |
          pnpm lint && pnpm typecheck && pnpm test
          node tools/check-package.mjs "packages/${{ matrix.release.dir }}" --keep "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.release.tag }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    needs: [tag, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.tag.outputs.unpublished) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          # npm 12.0.0 omits sigstore from its published bundle (npm/cli#9722).
          # Keep provenance publishing on the latest verified npm 11 release.
          npm install -g npm@11.18.0
          test -f "$(npm root -g)/npm/node_modules/sigstore/package.json"

      - uses: actions/download-artifact@v4
        with:
          name: tarball-${{ matrix.release.tag }}
          path: ${{ runner.temp }}/pack

      - name: Publish
        env:
          NAME: ${{ matrix.release.name }}
          VERSION: ${{ matrix.release.version }}
          DIST_TAG: ${{ matrix.release.distTag }}
        run: npm publish "$RUNNER_TEMP/pack/$(sed 's/^@//; s#/#-#' <<<"$NAME")-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"

  # A version on npm with no GitHub Release gets one here, including the hand-published first
  # version of a package.
  github-release:
    needs: [tag, publish]
    if: >-
      always() && needs.tag.result == 'success' && needs.tag.outputs.releases != '[]'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.tag.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.release.tag }}
      - name: Create or refresh the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.release.tag }}
          TITLE: ${{ matrix.release.name }}@${{ matrix.release.version }}
          VERSION: ${{ matrix.release.version }}
        run: |
          node tools/release.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"
          args=(--title "$TITLE" --prerelease="$([[ $VERSION == *-* ]] && echo true || echo false)")
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then args+=(--notes-file "$RUNNER_TEMP/notes.md"); else args+=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" "${args[@]}" --verify-tag
          fi
